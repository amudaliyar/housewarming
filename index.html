<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're Invited · Housewarming Invitation</title>
<meta property="og:title" content="You're Invited · Housewarming Invitation">
<meta property="og:description" content="Fri, 20 Nov 2026 · 7:30 – 10:00 AM · 📍 56, 57, Satva Vanam, Vanthvadi, Mehmedabad, Kheda – 387130">
<meta property="og:image" content="https://amudaliyar.github.io/housewarming/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://amudaliyar.github.io/housewarming/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F6E7C8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Mukta+Malar:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --maroon:#8E1B2C; --deep:#6E1422; --gold:#D9A23A; --gold2:#F6D77A; --green:#2E6B3F; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(ellipse at 50% 35%, #FFFBF2 0%, #F7EBD3 65%, #EBD6B0 100%) fixed; font-family: 'EB Garamond', Georgia, serif; color: #3B2A20; overflow-x: hidden; min-height: 100vh; min-height: 100dvh; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.35; background-image: radial-gradient(#D9A23A 1.2px, transparent 1.3px); background-size: 26px 26px; }
  button { font: inherit; }

  /* ---------- style picker (for choosing; remove when final) ---------- */
  .picker { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; gap: 4px; padding: 4px; border-radius: 30px; background: rgba(255,255,255,.94); box-shadow: 0 4px 16px rgba(110,20,34,.18); border: 1px solid rgba(217,162,58,.5); max-width: calc(100vw - 16px); overflow-x: auto; }
  .picker button { border: 0; background: none; padding: 7px 13px; border-radius: 24px; font-weight: 600; font-size: 14px; color: var(--maroon); white-space: nowrap; cursor: pointer; }
  .picker button.on { background: var(--maroon); color: #FFF4D6; }

  .intro { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3.6vh; padding: 3vh 16px; transition: opacity .8s ease, visibility .8s; }
  .intro.active { display: flex; }
  .intro.gone { opacity: 0; visibility: hidden; }
  .hello { text-align: center; transition: opacity .5s; }
  .hello .ta { font-family: 'Mukta Malar', sans-serif; font-weight: 600; color: var(--maroon); font-size: clamp(20px, 3.2vh, 28px); }
  .hello .scr { font-family: 'Great Vibes', cursive; color: var(--green); font-size: clamp(38px, 6.4vh, 58px); line-height: 1.2; margin-top: 1.2vh; }
  .hello .cap { font-family: 'Cinzel', serif; letter-spacing: .28em; font-size: 12px; color: #9C6A12; margin-top: 2vh; }
  .tap { font-family: 'Cinzel', serif; letter-spacing: .25em; font-size: 13px; color: var(--maroon); display: flex; align-items: center; gap: 10px; animation: pulse 1.8s ease-in-out infinite; transition: opacity .4s; }
  .tap::before, .tap::after { content: ""; width: 30px; height: 1px; background: var(--gold); }
  @keyframes pulse { 50% { opacity: .45; } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .opening .hello, .opening .tap { opacity: 0; animation: none; }
  .opener { cursor: pointer; }

  /* ===== ENVELOPE ===== */
  .env-wrap { perspective: 1400px; }
  .env { position: relative; width: min(82vw, 340px); aspect-ratio: 1.42; filter: drop-shadow(0 18px 28px rgba(110,20,34,.28)); animation: float 3.2s ease-in-out infinite; }
  .opening .env { animation: none; }
  .env-back { position: absolute; inset: 0; background: linear-gradient(160deg, #A3243A, var(--deep)); border-radius: 10px; }
  .env-card { position: absolute; left: 7%; width: 86%; top: 6%; height: 92%; border-radius: 6px; background: #fff url(card.png) center top / cover; transition: transform 1.1s cubic-bezier(.3,.9,.3,1) .55s; z-index: 1; }
  .opening .env-card { transform: translateY(-62%); }
  .env-front { position: absolute; inset: 0; z-index: 2; border-radius: 10px; overflow: hidden; pointer-events: none; }
  .env-front svg, .env-flap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .env-flap { position: absolute; left: 0; top: 0; width: 100%; height: 58%; z-index: 3; transform-origin: top center; transition: transform .7s ease-in, z-index 0s .35s; }
  .opening .env-flap { transform: rotateX(180deg); z-index: 0; }
  .seal { position: absolute; left: 50%; top: 58%; width: 78px; height: 78px; margin: -39px 0 0 -39px; z-index: 4; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FBE6A6, #D9A23A 55%, #9C6A12); box-shadow: 0 4px 10px rgba(0,0,0,.3), inset 0 0 0 3px rgba(255,255,255,.35), inset 0 0 0 6px rgba(156,106,18,.5); display: flex; align-items: center; justify-content: center; transition: transform .5s ease, opacity .4s ease; }
  .seal img { width: 44px; filter: brightness(.55) sepia(1) saturate(3) hue-rotate(-20deg); }
  .opening .seal { transform: scale(1.4); opacity: 0; }

  /* ===== TEMPLE DOORS ===== */
  .portal { --h: min(52vh, 520px, 150vw); position: relative; height: var(--h); width: calc(var(--h) * .66); transition: transform 1.3s cubic-bezier(.6,0,.4,1) 1.5s, opacity .9s ease 1.9s; transform-origin: 50% 58%; }
  .opening .portal { transform: scale(3.2); opacity: 0; }
  .frame { position: absolute; inset: 0; }
  .frame svg { width: 100%; height: 100%; display: block; }
  .doorway { position: absolute; left: 13.5%; right: 13.5%; top: 22%; bottom: 8.6%; overflow: hidden; perspective: 900px; background: radial-gradient(ellipse at 50% 55%, #FFFDF2 0%, #FFE7A0 35%, #F2B04A 80%, #D9862A 100%); }
  .door { position: absolute; top: 0; bottom: 0; width: 50%; transition: transform 1.6s cubic-bezier(.55,.05,.35,1) .1s; }
  .door svg { width: 100%; height: 100%; display: block; }
  .door.l { left: 0; transform-origin: left center; }
  .door.r { right: 0; transform-origin: right center; }
  .opening .door.l { transform: rotateY(-108deg); }
  .opening .door.r { transform: rotateY(108deg); }
  .thor { position: absolute; left: 13.5%; right: 13.5%; top: 21%; height: 11%; z-index: 3; pointer-events: none; overflow: visible; }
  .gmed { position: absolute; left: 50%; top: 3.2%; width: 15%; aspect-ratio: 1; transform: translateX(-50%); z-index: 3; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FBE6A6, #D9A23A 55%, #9C6A12); box-shadow: 0 0 0 3px #3E1C08, 0 0 0 5px var(--gold), 0 4px 10px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
  .gmed img { width: 62%; filter: brightness(.5) sepia(1) saturate(3) hue-rotate(-20deg); }
  .flame { animation: flick 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes flick { 50% { transform: scale(1.08, .9); } }

  /* ===== SCROLL ===== */
  .scroll { width: min(78vw, 330px); position: relative; animation: float 3.2s ease-in-out infinite; }
  .opening .scroll { animation: none; }
  .rod { position: relative; height: 26px; margin: 0 -18px; border-radius: 13px; background: linear-gradient(#F6D77A, #C88E2A 45%, #8A5A10 80%, #C88E2A); box-shadow: 0 4px 8px rgba(0,0,0,.25); z-index: 2; }
  .rod::before, .rod::after { content: ""; position: absolute; top: -5px; width: 18px; height: 36px; border-radius: 9px; background: radial-gradient(circle at 40% 35%, #FBE6A6, #9C6A12); }
  .rod::before { left: -10px; } .rod::after { right: -10px; }
  .paper { height: 34px; overflow: hidden; background: #FFF9EC url(card.png) center top / 100% auto; transition: height 2s cubic-bezier(.5,0,.3,1) .5s; box-shadow: inset 0 8px 10px -6px rgba(0,0,0,.25), inset 0 -8px 10px -6px rgba(0,0,0,.25); }
  .tie { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; z-index: 3; transition: transform .6s ease-in, opacity .5s; }
  .tie .band { position: absolute; left: 24px; top: -30px; width: 16px; height: 124px; background: linear-gradient(90deg, #A3243A, #D63C5A, #A3243A); }
  .tie .seal { top: 0; left: 0; margin: 0; width: 64px; height: 64px; }
  .tie .seal img { width: 36px; }
  .opening .tie { transform: translateY(80px) rotate(25deg); opacity: 0; }

  /* ================= CARD ================= */
  #main { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; padding: 14px 12px 40px; gap: 20px; opacity: 0; transform: scale(.94); transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
  #main.show { opacity: 1; transform: none; pointer-events: auto; }
  .cardbox { position: relative; width: min(100%, 560px, calc((100vh - 28px) * .6171)); width: min(100%, 560px, calc((100dvh - 28px) * .6171)); container-type: inline-size; }
  .card { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 16px 40px rgba(110,20,34,.25), 0 0 0 1px rgba(217,162,58,.4); }
  /* venue box + button are one big tap area */
  .venue-hit { position: absolute; left: 19.3%; right: 19.3%; top: 86.2%; height: 10.2%; border-radius: 1.8cqw; display: block; }
  .vglow { position: absolute; left: 19.3%; right: 19.3%; top: 86.15%; height: 6.6%; border-radius: 1.8cqw; pointer-events: none; animation: hl 2.4s ease-in-out 1.2s 2; }
  @keyframes hl { 50% { background: rgba(246,215,122,.3); box-shadow: 0 0 0 .4cqw rgba(217,162,58,.55); } }
  .hint { position: absolute; left: 50%; top: 94.9%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: .8cqw; padding: .35cqw 2.4cqw; border-radius: 4cqw; white-space: nowrap;
    background: linear-gradient(135deg, #A3243A, #6E1422); color: #FFF4D6; font-family: 'EB Garamond', serif; font-weight: 600; font-size: 2.3cqw; line-height: 1.25; box-shadow: 0 2px 6px rgba(110,20,34,.3); pointer-events: none; animation: nudge 1.8s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }

  .count { text-align: center; }
  .count .num { font-family: 'Cinzel', serif; font-size: 34px; color: var(--maroon); }
  .count .lbl { font-family: 'Cinzel', serif; letter-spacing: .25em; font-size: 11px; color: #9C6A12; }
  .count .ta { font-family: 'Mukta Malar', sans-serif; font-size: 15px; color: #6b4a2e; margin-top: 2px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(100%, 520px); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 10px; border-radius: 40px; text-decoration: none; font-weight: 600; font-size: 17px; border: 1.5px solid var(--gold); color: var(--maroon); background: rgba(255,255,255,.75); }
  .btn svg { width: 19px; height: 19px; }
  .bless { font-family: 'Great Vibes', cursive; font-size: 30px; color: var(--green); text-align: center; }
  .bless small { display: block; font-family: 'Mukta Malar', sans-serif; font-size: 15px; color: #6b4a2e; }
  #replay { background: none; border: 0; font-family: 'Cinzel', serif; letter-spacing: .2em; font-size: 11px; color: #9C6A12; cursor: pointer; }

  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .petal { position: absolute; top: -30px; border-radius: 60% 0 60% 0; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { .env, .scroll, .hint, .vglow, .flame { animation: none; } .petal { display: none; } }
</style>
</head>
<body>

<!-- ENVELOPE -->
<section class="intro" id="envelope">
  <div class="hello"><div class="ta">புதுமனை புகுவிழா</div><div class="scr">You're Invited</div><div class="cap">HOUSEWARMING INVITATION</div></div>
  <div class="env-wrap opener" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="env">
      <div class="env-back"></div>
      <div class="env-card"></div>
      <div class="env-front">
        <svg viewBox="0 0 284 200" preserveAspectRatio="none">
          <defs><linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9E2236"/><stop offset="1" stop-color="#7A1626"/></linearGradient></defs>
          <path d="M0,0 L142,112 L284,0 L284,200 L0,200 Z" fill="url(#fr)"/>
          <path d="M0,200 L142,104 L284,200" fill="none" stroke="#D9A23A" stroke-width="1.6"/>
          <rect x="7" y="7" width="270" height="186" rx="6" fill="none" stroke="#D9A23A" stroke-width="1.2" stroke-dasharray="2 4" opacity=".8"/>
        </svg>
      </div>
      <div class="env-flap">
        <svg viewBox="0 0 284 116" preserveAspectRatio="none">
          <defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B02A40"/><stop offset="1" stop-color="#8A1A2C"/></linearGradient></defs>
          <path d="M0,0 L284,0 L142,116 Z" fill="url(#fl)" stroke="#D9A23A" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M18,6 L266,6 L142,104 Z" fill="none" stroke="#F6D77A" stroke-width=".8" stroke-dasharray="2 4" opacity=".7"/>
        </svg>
      </div>
      <div class="seal"><img src="ganesha.png" alt=""></div>
    </div>
  </div>
  <div class="tap">TAP TO OPEN</div>
</section>

<!-- CARD -->
<main id="main" aria-hidden="true">
  <div class="cardbox">
    <img class="card" src="card.png" alt="Housewarming invitation of Rameshkumar and Usharani, Friday 20 November 2026, 7:30 AM to 10:00 AM">
    <span class="vglow" aria-hidden="true"></span>
    <a class="venue-hit maplink" target="_blank" rel="noopener" aria-label="Venue – tap to open in Google Maps"></a>
    <span class="hint" aria-hidden="true">👆 Tap for map</span>
  </div>

  <div class="count" id="count"></div>
  <div class="btns">
    <a class="btn" id="cal" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Add to Calendar</a>
    <a class="btn" href="card.png" download="Housewarming Invitation.png"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>Save Card</a>
  </div>
  <div class="bless">With love &amp; blessings<small>உங்கள் வருகையை அன்புடன் எதிர்நோக்குகிறோம்</small></div>
  <button id="replay">OPEN AGAIN</button>
</main>

<div id="petals"></div>

<script>
/* ======= EDIT THESE ======= */
const EVENT = {
  title: 'Housewarming – Rameshkumar & Usharani',
  startUTC: '20261120T020000Z', endUTC: '20261120T043000Z',   // 7:30–10:00 AM IST
  dateIST: '2026-11-20T07:30:00+05:30',
  address: '56, 57, Satva Vanam, Vanthvadi, Mehmedabad, Kheda – 387130',
  mapsLink: 'https://maps.google.com/?cid=11790735034015099581'      // paste the Google Maps share link here (otherwise the address is searched)
};
/* ========================== */

const mapURL = EVENT.mapsLink || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(EVENT.address);
document.querySelectorAll('.maplink').forEach(a => a.href = mapURL);
document.getElementById('cal').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
  + '&text=' + encodeURIComponent(EVENT.title) + '&dates=' + EVENT.startUTC + '/' + EVENT.endUTC
  + '&details=' + encodeURIComponent('புதுமனை புகுவிழா · Griha Pravesam\nDirections: ' + mapURL)
  + '&location=' + encodeURIComponent(EVENT.address);

(function () {
  const el = document.getElementById('count');
  const d = Math.ceil((new Date(EVENT.dateIST) - new Date()) / 864e5);
  if (d > 1) el.innerHTML = `<div class="num">${d}</div><div class="lbl">DAYS TO GO</div><div class="ta">இன்னும் ${d} நாட்கள்</div>`;
  else if (d === 1) el.innerHTML = `<div class="lbl">SEE YOU</div><div class="num">Tomorrow!</div>`;
  else if (d === 0) el.innerHTML = `<div class="lbl">IT'S</div><div class="num">Today!</div>`;
  else el.innerHTML = `<div class="lbl">THANK YOU FOR YOUR BLESSINGS</div>`;
})();

/* ---------- petals ---------- */
function petals(n = 60) {
  const box = document.getElementById('petals');
  const cols = ['#F5871F', '#FFC93C', '#FFB300', '#E65100', '#C2185B', '#FFD54F'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'), s = 10 + Math.random() * 12;
    p.className = 'petal';
    p.style.cssText = `left:${Math.random() * 100}vw;width:${s}px;height:${s * .8}px;background:${cols[i % 6]};--dx:${(Math.random() - .5) * 160}px;--r:${(Math.random() - .5) * 900}deg;animation-duration:${3.5 + Math.random() * 3}s;animation-delay:${Math.random() * 1.6}s`;
    box.appendChild(p); setTimeout(() => p.remove(), 9000);
  }
}

/* ---------- flow ---------- */
const STYLES = ['envelope'];
const TIMING = { envelope: 2000, doors: 2700, scroll: 2900 };
const main = document.getElementById('main');
let cur = 'envelope', opened = false;

function show(style, skip) {
  cur = 'envelope';
  opened = false;
  document.querySelectorAll('.intro').forEach(el => el.classList.remove('active', 'gone', 'opening'));
  main.classList.remove('show'); main.setAttribute('aria-hidden', 'true');
  const sec = document.getElementById(cur);
  sec.classList.add('active');
  if (skip) { sec.classList.add('opening', 'gone'); main.classList.add('show'); main.setAttribute('aria-hidden', 'false'); }
  window.scrollTo(0, 0);
}
function openInvite() {
  if (opened) return; opened = true;
  const sec = document.getElementById(cur);
  sec.classList.add('opening');
  setTimeout(petals, TIMING[cur] - 1100);
  setTimeout(() => { sec.classList.add('gone'); main.classList.add('show'); main.setAttribute('aria-hidden', 'false'); window.scrollTo(0, 0); }, TIMING[cur]);
}
document.querySelectorAll('.opener').forEach(o => {
  o.addEventListener('click', openInvite);
  o.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); } });
});
document.getElementById('replay').addEventListener('click', () => show(cur));
function route() { const h = location.hash.slice(1); show(h.replace(/-card$/, ''), h.endsWith('-card')); }
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
